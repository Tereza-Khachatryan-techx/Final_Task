<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css"/>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <div class="burger-menu">
                <div class="burger-menu-item line-1"></div>
                <div class="burger-menu-item line-2"></div>
                <div class="burger-menu-item line-3"></div>
            </div>
            <img src="./assets/images/logo.png" class="logo"/>  
            <div class="links">
                <div class="nav-left">
                    <a class="nav-link" href="/">How we Work</a>
                    <a class="nav-link" href="/">Find an Agent</a>
                    <a class="nav-link" href="/">Knowledge Center</a>
                </div>
                <div class="nav-right">
                    <a href="/" class="nav-link" style="font-weight: 600;">Sign In</a>
                    <button class="join-btn">Join Now</button>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="page-hero">
            <div class="search-container">
                <div class="heading">
                    <h2>Search our listings for your next purchase</h2>
                </div>
                <div class="search">
                    <div class="location-input">
                        <img src="./assets/icons/location.svg" class="location-icn"/>
                        <input type="text" class="search-input" placeholder="Enter City, neighbourhood, ZIP, or address"/>
                    </div>
                    <div class="search-icn-container">
                        <img src="./assets/icons/search.svg" class="search-icn"/>
                    </div>
                </div>
            </div>
            <div class="hero-page-image">
                <img src="./assets/images/house.png"/>
            </div>
        </section>
        <section class="featured-listing">
            <div class="listing-container">
                <h2 class="section-header">Our Featured Listing</h2>
                <div class="cards">
                    <div class="card card1">
                        <div class="card-image">
                            <div class="home-status">
                                <p>New</p>
                            </div>
                            <div class="person-img-div">
                                <img src="./assets/images/card-person.png"/>
                            </div>
                            <img src="./assets/images/card-1.png" alt="Card Image" class="card-img">
                        </div>
                        <div class="apartment-info">
                            <div class="info-left">
                                <div class="apartment-info-heading">
                                    <h2>Apartment#1</h2>
                                    <p class="appart-address">Bronx, NY 10459</p>
                                </div>
                                <div class="appartment-icons">
                                    <img src="./assets/icons/apartment-info-1.svg" alt="Icon" style="width: 27px;"/>
                                    <img src="./assets/icons/apartment-info-2.svg" alt="Icon"/>
                                    <img src="./assets/icons/apartment-info-3.svg" alt="Icon" style="width: 19px;"/>
                                    <img src="./assets/icons/apartment-info-4.svg" alt="Icon" style="width: 17.7px;"/>
                                    <img src="./assets/icons/apartment-info-5.svg" alt="Icon"/>
                                </div>
                            </div>
                            <div class="info-right">
                                <img src="./assets/icons/location.svg" alt="Loaction Icon"/>
                                <p>1.1km away</p>
                            </div>
                        </div>
                        <div class="card-footer">
                            <h3 style="margin-left: 16px;">$30.000</h3>
                            <div class="reaction-btns">
                                <img src="./assets/icons/like.png" alt="Like Icon"/>
                                <img src="./assets/icons/share.png" alt="Share Icon"/>
                            </div>
                        </div>
                    </div>
                    <div class="card card2">
                        <div class="card-image">
                            <div class="home-status" style="background: rgba(178, 210, 53, 1)">
                                <p>Rent</p>
                            </div>
                            <div class="person-img-div">
                                <img src="./assets/images/card-person.png"/>
                            </div>
                            <img src="./assets/images/card-2.png" alt="Card Image" class="card-img" />
                        </div>
                        <div class="apartment-info">
                            <div class="info-left">
                                <div class="apartment-info-heading">
                                    <h2>Apartment#1</h2>
                                    <p class="appart-address">Bronx, NY 10459</p>
                                </div>
                                <div class="appartment-icons">
                                    <img src="./assets/icons/apartment-info-1.svg" alt="Icon" style="width: 27px;"/>
                                    <img src="./assets/icons/apartment-info-2.svg" alt="Icon"/>
                                    <img src="./assets/icons/apartment-info-3.svg" alt="Icon" style="width: 19px;"/>
                                    <img src="./assets/icons/apartment-info-4.svg" alt="Icon" style="width: 17.7px;"/>
                                    <img src="./assets/icons/apartment-info-5.svg" alt="Icon"/>
                                </div>
                            </div>
                            <div class="info-right">
                                <img src="./assets/icons/location.svg" alt="Loaction Icon"/>
                                <p>1.1km away</p>
                            </div>
                        </div>
                        <div class="card-footer">
                            <h3 style="margin-left: 16px;">$123/Month</h3>
                            <div class="reaction-btns">
                                <img src="./assets/icons/liked.png" alt="Like Icon"/>
                                <img src="./assets/icons/share.png" alt="Share Icon"/>
                            </div>
                            <img src="./assets/icons/mouse.png" alt="Mouse Icon" class="mouse-icn"/>
                        </div>
                    </div>
                    <div class="card card3">
                        <div class="card-image">
                            <div class="home-status">
                                <p>New</p>
                            </div>
                            <div class="home-status" style="margin-left: 88px; background: rgba(178, 210, 53, 1)">
                                <p>New</p>
                            </div>
                            <div class="person-img-div">
                                <img src="./assets/images/card-person.png"/>
                            </div>
                            <img src="./assets/images/card-3.png" alt="Card Image" class="card-img">
                        </div>
                        <div class="apartment-info">
                            <div class="info-left">
                                <div class="apartment-info-heading">
                                    <h2>Apartment#1</h2>
                                    <p class="appart-address">Bronx, NY 10459</p>
                                </div>
                                <div class="appartment-icons">
                                    <img src="./assets/icons/apartment-info-1.svg" alt="Icon" style="width: 27px;"/>
                                    <img src="./assets/icons/apartment-info-2.svg" alt="Icon"/>
                                    <img src="./assets/icons/apartment-info-3.svg" alt="Icon" style="width: 19px;"/>
                                    <img src="./assets/icons/apartment-info-4.svg" alt="Icon" style="width: 17.7px;"/>
                                    <img src="./assets/icons/apartment-info-5.svg" alt="Icon"/>
                                </div>
                            </div>
                            <div class="info-right">
                                <img src="./assets/icons/location.svg" alt="Loaction Icon"/>
                                <p>1.1km away</p>
                            </div>
                        </div>
                        <div class="card-footer">
                            <h3 style="margin-left: 16px;">$30.000</h3>
                            <div class="reaction-btns">
                                <img src="./assets/icons/like.png" alt="Like Icon"/>
                                <img src="./assets/icons/share.png" alt="Share Icon"/>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="cards-footer">
                    <div class="ovals">
                        <div><img src="./assets/icons/green-oval.png"/></div>
                        <div><img src="./assets/icons/gray-oval.png"/></div>
                        <div><img src="./assets/icons/gray-oval.png"/></div>
                        <div><img src="./assets/icons/gray-oval.png"/></div>
                        <div><img src="./assets/icons/gray-oval.png"/></div>
                        <div><img src="./assets/icons/gray-oval.png"/></div>
                        <div><img src="./assets/icons/gray-oval.png"/></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
